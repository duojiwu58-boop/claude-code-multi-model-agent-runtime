[package]
name = "ls-agent-core"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
ls-wire = { path = "../ls-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
uuid = { version = "=1.8.0", features = ["v4"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }