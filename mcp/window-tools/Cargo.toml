[package]
name = "mcp-window-tools"
version = "0.1.0"
edition = "2021"
description = "通用窗口/截图工具集 (stdio MCP for Claude Code): 窗口枚举、窗口截图、全屏截图、调整窗口尺寸"
license = "GPL-3.0-only"

[dependencies]
base64 = "=0.22.1"
png = "=0.17.16"
serde_json = "=1.0.117"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
