[package]
name = "mcp-window-tools"
version = "0.2.0"
edition = "2021"
description = "通用 Windows GUI 工具集 (stdio MCP for Claude Code): 窗口观察、布局验证与安全输入驱动"
license = "GPL-3.0-only"

[dependencies]
base64 = "=0.22.1"
png = "=0.17.16"
serde_json = "=1.0.117"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
