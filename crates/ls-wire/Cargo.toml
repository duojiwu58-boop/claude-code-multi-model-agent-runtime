[package]
name = "ls-wire"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
futures-util = "=0.3.31"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
uuid = { version = "=1.8.0", features = ["v4"] }